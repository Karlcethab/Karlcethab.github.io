	<div id="modalOverlay" class="modal-overlay">

        <div id="quizModal" class="quiz-modal">

            <!-- 弹窗背景图 -->
            <img
                id="modalBackground"
                class="modal-background"
                src="assets/scenario/reserve.png"
                alt="q-bg"
            >

            <!-- 半透明遮罩 -->
            <div class="modal-dark"></div>

            <!-- 弹窗内容 -->
            <div class="modal-content">

                <button
                    id="closeButton"
                    class="close-button"
                    aria-label="关闭">×
                </button>

                <button id="switchButton" class="switch-button"></button>



				<div id="questionArea">

                    <div id ="itemImage" class = "item-image"></div>

  			        <div id="questionStem" class="question-stem"></div>
                    <div id="questionText" class="question-text"></div>

			        <div class="answer-area">

		              <input
		            id="answerInput"
        		    type="text"
        		    maxlength="20"
        		    autocomplete="off"
            		placeholder="……">

                    <button id="submitButton"><h3> 是这样吧</h3></button>
                </div>



		                <!-- 提示 -->
        <div id="hintArea" class="hint-area">

            <div class="hint-label">

            </div>

            <div id="hintImage">
                        提示加载中……
            </div>


        </div>


                <!-- 切换按钮 -->

        <div id="result-text" class="result-text"></div>

    </div>

</div>


    <audio
        id="backgroundMusic1"
        src="assets/music/phase1.mp3"
        loop
        preload="auto"
    ></audio>
